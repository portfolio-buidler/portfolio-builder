[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "portfolio-backend"
version = "0.0.1"
description = "FastAPI backend for CV parsing and portfolio builder"
requires-python = ">=3.12"

dependencies = [
  # API + server
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",

  # Validation + forms
  "pydantic[email]>=2.7",
  "python-multipart>=0.0.9",

  # DB stack
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "asyncpg>=0.29",

  # Parsing core
  "pypdf>=5.0.0",
  "defusedxml>=0.7.1",
  "regex>=2024.5.15",
  "phonenumbers>=8.13.0",
  "ftfy>=6.2.0",

  # runtime env
  "python-dotenv>=1.0.0",

  # auth
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",

  # ---- HERE: add pytest as a real dependency ----
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "psycopg2-binary>=2.9",
  "pytest-cov>=5.0.0"
]

[project.optional-dependencies]
docx-fallbacks = [ "python-docx>=1.1.2" ]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing"
testpaths = ["app/tests"]
python_files = "test_*.py"
asyncio_mode = "strict"