name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, integrity-testing ]
    paths:
      - "backend/**"
      - ".github/workflows/integration-tests.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "backend/**"
      - ".github/workflows/integration-tests.yml"

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: portfoliodb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d portfoliodb_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/portfoliodb_test
      TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/portfoliodb_test
      SECRET_KEY: test-secret-key-for-ci-pipeline-only
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      BCRYPT_ROUNDS: "4"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run Alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run integration tests
        working-directory: backend
        run: |
          pytest app/tests/features/test_protected_endpoints.py -v --tb=short

      - name: Run all backend tests
        working-directory: backend
        run: |
          pytest app/tests/ -v --tb=short --ignore=app/tests/unit/

  auth-coverage:
    name: Auth Endpoint Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: portfoliodb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d portfoliodb_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/portfoliodb_test
      TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/portfoliodb_test
      SECRET_KEY: test-secret-key-for-ci-pipeline-only
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      BCRYPT_ROUNDS: "4"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run Alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest app/tests/features/ -v --cov=app/features --cov=app/core/security --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: integration
          name: integration-coverage
          fail_ci_if_error: false

