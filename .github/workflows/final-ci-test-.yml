name: Production CI Pipeline

on:
  push:
    branches: [ integrity-testing ]
  pull_request:
    branches: [ integrity-testing ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Backend (Migrations + Unit Tests + Coverage)
  # ------------------------------------------------------------------
  backend-ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: portfolio_test
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: portfolio_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: portfolio_test
      POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      POSTGRES_DB: portfolio_db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}

      DATABASE_URL: postgresql+asyncpg://portfolio_test:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/portfolio_db
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://portfolio_test:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/portfolio_db

      UPLOAD_DIR: "uploads"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary
          cd backend
          pip install -e .[dev]

      - name: 1. Run Migration Verification (Safety Check)
        working-directory: backend
        run: pytest app/tests/test_migrations.py -v

      - name: 2. Run Unit Tests & Check Coverage
        working-directory: backend
        run: pytest --cov=app --cov-fail-under=80

  # ------------------------------------------------------------------
  # JOB 2: Frontend (Lint + Typecheck + Unit Tests + Coverage)
  # ------------------------------------------------------------------
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: 1. Type Check (TypeScript)
        working-directory: frontend
        run: npm run type-check

      - name: 2. Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: "3. Unit Tests & Coverage (Gate 80%)"
        working-directory: frontend
        run: npm run test:coverage

  # ------------------------------------------------------------------
  # JOB 3: E2E Tests (Full Stack Integration)
  # ------------------------------------------------------------------
  e2e-ci:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start Backend Stack
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ci_db
          DATABASE_URL: postgresql+asyncpg://ci_user:${{ secrets.CI_DB_PASSWORD }}@db:5432/ci_db
          BACKEND_PORT: 9000
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
        run: |
          docker compose up -d --build db migrate backend
          echo "Waiting for backend..."
          sleep 15
          docker compose logs backend

      - name: Run E2E Tests
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:9000
        run: npm run e2e

      - name: Upload E2E Artifacts (Screenshots/Videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 3
