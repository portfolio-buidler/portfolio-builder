name: Production CI Pipeline

on:
  push:
    branches: [ integrity-testing ]
  pull_request:
    branches: [ integrity-testing ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Backend (Migrations + Unit Tests + Coverage)
  # ------------------------------------------------------------------
  backend-ci:
    runs-on: ubuntu-latest
    services:
      # Isolated Postgres for this job
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: portfolio_test
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: portfolio_db
        ports:
          - 5432:5432
        # Simple health check to wait for DB
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 1. Individual vars for config.py to pick up
      POSTGRES_USER: portfolio_test
      POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      POSTGRES_DB: portfolio_db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}

      # 2. Connection strings dynamically built from secrets
      DATABASE_URL: postgresql+asyncpg://portfolio_test:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/portfolio_db
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://portfolio_test:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/portfolio_db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install psycopg2-binary explicitly for migration testing (sync driver)
          pip install psycopg2-binary
          # Install project deps
          cd backend
          pip install -e .[dev]

      - name: 1. Run Migration Verification (Safety Check)
        working-directory: backend
        # Runs the Up/Down test on an isolated test_migrations_db
        run: pytest app/tests/test_migrations.py -v

      - name: 2. Run Unit Tests & Check Coverage
        working-directory: backend
        # Fails if coverage is below 80%
        run: pytest --cov=app --cov-fail-under=80

  # ------------------------------------------------------------------
  # JOB 2: Frontend (Lint + Typecheck + Unit Tests + Coverage)
  # ------------------------------------------------------------------
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: 1. Type Check (TypeScript)
        working-directory: frontend
        run: npm run type-check

      - name: 2. Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: 3. Unit Tests & Coverage (Gate 80%)
        working-directory: frontend
        # Ensure vitest.config.ts thresholds are set to 80
        run: npm run test:coverage

  # ------------------------------------------------------------------
  # JOB 3: E2E Tests (Full Stack Integration)
  # ------------------------------------------------------------------
  e2e-ci:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci] # Only run if units pass
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # Spin up the REAL environment using Docker Compose
      - name: Start Backend Stack
        env:
          # Inject secrets into the container environment
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ci_db
          # Note: Host is 'db' because this runs inside docker network
          DATABASE_URL: postgresql+asyncpg://ci_user:${{ secrets.CI_DB_PASSWORD }}@db:5432/ci_db
          BACKEND_PORT: 9000
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
        run: |
          # Build and start DB, Migration Service, and Backend
          docker compose up -d --build db migrate backend
          
          # Wait for backend to be ready
          echo "Waiting for backend..."
          sleep 15
          docker compose logs backend

      - name: Run E2E Tests
        working-directory: frontend
        env:
          # Point tests to the local dockerized backend
          VITE_API_BASE_URL: http://localhost:9000
        run: npm run e2e

      - name: Upload E2E Artifacts (Screenshots/Videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 3
