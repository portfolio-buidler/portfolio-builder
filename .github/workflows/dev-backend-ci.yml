name: Backend CI (dev)

on:
  workflow_dispatch:  # make it possible to run without pushing(for tests purposes)
  push:
    branches: [ dev ]
    paths:
      - "backend/**"
      - "backend/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ dev ]
    paths:
      - "backend/**"
      - "backend/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Configure Poetry (no venv in CI)
        working-directory: backend
        run: poetry config virtualenvs.create false

      - name: Cache Poetry downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-

      - name: Install deps
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      # Lint
      - name: Ruff
        working-directory: backend
        run: |
          poetry run pip install ruff
          poetry run ruff check .

      # Type check (soft fail for now)
      - name: Mypy
        working-directory: backend
        run: |
          poetry run pip install mypy
          poetry run mypy app || true

      # Security
      - name: Bandit
        working-directory: backend
        run: |
          poetry run pip install bandit
          poetry run bandit -q -r app -x tests

      - name: pip-audit (soft)
        working-directory: backend
        run: |
          poetry run pip install pip-audit
          poetry run pip-audit --progress-spinner=off || true

      # Tests
      - name: Pytest
        working-directory: backend
        run: poetry run pytest -q --maxfail=1 --disable-warnings

      # Docker build (validate Dockerfile; no push)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: portfolio-backend:ci
